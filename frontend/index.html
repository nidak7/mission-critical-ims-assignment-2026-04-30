<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission-Critical IMS</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <p class="kicker">Incident Management System</p>
        <h1>Operations dashboard</h1>
        <p class="header-note">Monitor active incidents, review raw signals, and capture RCA before closure.</p>
      </header>

      <section
        class="stats-panel"
        hx-get="/ui/overview"
        hx-trigger="load, every 5s"
        hx-target="this"
        hx-swap="innerHTML"
      ></section>

      <main class="layout">
        <aside class="list-panel">
          <div class="panel-header">
            <div>
              <p class="kicker">Active queue</p>
              <h2>Incidents</h2>
            </div>
            <span>Sorted by severity</span>
          </div>
          <div
            class="feed-list"
            hx-get="/ui/incidents"
            hx-trigger="load, every 5s"
            hx-target="this"
            hx-swap="innerHTML"
          ></div>
        </aside>

        <section id="detail-panel" class="detail-panel">
          <div class="empty-detail">
            <h3>Select an incident</h3>
            <p>The selected incident will show status, linked raw signals, and the RCA form.</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
